name: Build PS4&5onPC Hub for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 installer and portable app
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install
        shell: pwsh

      - name: Generate Tauri icons
        run: |
          if (Test-Path "src-tauri/icons/app-icon.png") {
            npx tauri icon src-tauri/icons/app-icon.png
          }
        shell: pwsh

      - name: Build Windows installer
        run: npx tauri build --bundles nsis
        shell: pwsh

      - name: Stage portable executable
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "ps4and5onpc-hub.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Could not find ps4and5onpc-hub.exe" }
          Copy-Item $exe.FullName "artifacts/PS4and5onPC-Hub-Portable.exe"
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | ForEach-Object {
            Copy-Item $_.FullName "artifacts/"
          }
        shell: pwsh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS4and5onPC-Hub-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
